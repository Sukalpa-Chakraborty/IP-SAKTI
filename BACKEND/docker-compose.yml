# Local development database: PostgreSQL with pgvector (needed from Phase 4).
#
#   docker compose up -d
#   DATABASE_URL=postgresql://ipsakti:ipsakti@localhost:5433/ipsakti
#
# Port 5433 (not 5432) so it does not clash with an existing local PostgreSQL
# installation. Data lives in the named volume and survives restarts.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ip-sakti-postgres
    environment:
      POSTGRES_USER: ipsakti
      POSTGRES_PASSWORD: ipsakti
      POSTGRES_DB: ipsakti
    ports:
      - "5433:5432"
    volumes:
      - ip_sakti_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipsakti -d ipsakti"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ip_sakti_pgdata:
